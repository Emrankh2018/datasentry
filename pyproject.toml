[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "datasentry"
version = "0.1.0"
description = "Local-first Python toolkit for CSV data profiling, quality checks, anomaly detection, and schema comparison."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pandas>=2.2,<4", "streamlit>=1.66,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
datasentry = "datasentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 96
extend-exclude = ["graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
